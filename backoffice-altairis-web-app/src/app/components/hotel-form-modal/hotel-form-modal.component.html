<!-- Modal Overlay -->
<div class="modal-overlay" [class.open]="isOpen" (click)="onClose()">
  
  <!-- Modal Container -->
  <div class="modal-container" [class.open]="isOpen" (click)="$event.stopPropagation()">
    
    <!-- Modal Header -->
    <div class="modal-header">
      <h2>{{ title() }}</h2>
      <button class="btn-close" (click)="onClose()">✕</button>
    </div>
    
    <!-- Modal Body -->
    <div class="modal-body">
      
      <!-- Error Message -->
      @if (error()) {
        <div class="error-message">
          <span class="error-icon">⚠️</span>
          {{ error() }}
        </div>
      }
      
      <!-- Hotel Form -->
      <form (ngSubmit)="onSubmit()" #hotelForm="ngForm">
        
        <!-- Hotel Name -->
        <div class="form-group">
          <label for="name">Hotel Name</label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="formData().name"
            required
            class="form-control"
            placeholder="Enter hotel name"
          />
        </div>
        
        <!-- Description -->
        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            [(ngModel)]="formData().description"
            rows="4"
            class="form-control"
            placeholder="Enter hotel description"
          ></textarea>
        </div>
        
        <!-- Country and City Row -->
        <div class="form-row">
          <div class="form-group">
            <label for="country">Country</label>
            <input
              type="text"
              id="country"
              name="country"
              [(ngModel)]="formData().country"
              required
              class="form-control"
              placeholder="Country"
            />
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <input
              type="text"
              id="city"
              name="city"
              [(ngModel)]="formData().city"
              required
              class="form-control"
              placeholder="City"
            />
          </div>
        </div>
        
        <!-- Address -->
        <div class="form-group">
          <label for="address">Address</label>
          <input
            type="text"
            id="address"
            name="address"
            [(ngModel)]="formData().address"
            required
            class="form-control"
            placeholder="Street address"
          />
        </div>
        
        <!-- Main Photo URL -->
        <div class="form-group">
          <label for="mainPhoto">Main Photo URL</label>
          <input
            type="url"
            id="mainPhoto"
            name="mainPhoto"
            [(ngModel)]="formData().mainPhoto"
            class="form-control"
            placeholder="https://example.com/photo.jpg"
          />
          @if (formData().mainPhoto) {
            <div class="photo-preview">
              <img [src]="formData().mainPhoto" alt="Preview" class="preview-image" />
            </div>
          }
        </div>
        
        <!-- Stars Rating -->
        <div class="form-group">
          <label>Star Rating *</label>
          <div class="stars-selector">
            @for (star of starRatings; track star) {
              <button
                type="button"
                class="star-btn"
                [class.active]="formData().stars >= star"
                (click)="updateStars(star)"
              >
                ★
              </button>
            }
          </div>
          <small class="form-text">{{ formData().stars }} out of 5 stars</small>
        </div>
        
        <!-- Form Actions -->
        <div class="form-actions">
          <button type="button" class="btn-cancel" (click)="onClose()">
            Cancel
          </button>
          <button 
            type="submit" 
            class="btn-submit" 
            [disabled]="loading() || !hotelForm.form.valid"
          >
            @if (loading()) {
              <span class="spinner-small"></span>
              Saving...
            } @else {
              {{ submitButtonText() }}
            }
          </button>
        </div>
        
      </form>
    </div>
  </div>
</div>
