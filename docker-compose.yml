services:
  mysql:
    image: mysql:8.0
    container_name: hotelbooking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: backoffice_altairis
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hotel-network

  backend:
    build: ./BackofficeAltairis
    container_name: hotelbooking-backend
    restart: unless-stopped
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=backoffice_altairis;User=root;Password=root;
      - ASPNETCORE_URLS=http://+:8080
    ports:
      - "5120:8080"
    depends_on:
      - mysql
    networks:
      - hotel-network

  frontend:
    build:
      context: ./backoffice-altairis-web-app
      dockerfile: Dockerfile  
    container_name: hotelbooking-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  mysql_data: